<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>eve</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="iro.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #1b1b1f);
    --hint: var(--tg-theme-hint-color, #8a8a92);
    --link: var(--tg-theme-link-color, #2f6fde);
    --accent: var(--tg-theme-button-color, #2f6fde);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --bubble: var(--tg-theme-secondary-bg-color, #f1f1f4);
    --code: rgba(127, 127, 127, 0.14);
    --danger: var(--tg-theme-destructive-text-color, #d93838);
    --sheet: var(--tg-theme-secondary-bg-color, #f1f1f4);
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: var(--tg-theme-bg-color, #17171b); --text: var(--tg-theme-text-color, #ececf1);
      --hint: var(--tg-theme-hint-color, #8d8d96); --bubble: var(--tg-theme-secondary-bg-color, #232329);
      --link: var(--tg-theme-link-color, #6ea2ff); --accent: var(--tg-theme-button-color, #3e7bf0);
      --danger: var(--tg-theme-destructive-text-color, #ff6b6b); --sheet: var(--tg-theme-secondary-bg-color, #232329);
    }
  }
  * { box-sizing: border-box; }
  /* --app-h: the visible height (the phone's keyboard taken off), so a composer at the bottom stays above it */
  html, body { margin: 0; height: var(--app-h, 100%); background: var(--bg); color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 10px 16px; border-bottom: 1px solid var(--code); }
  header .who { font-weight: 600; font-size: 17px; margin: 0; }
  header .spent { color: var(--hint); font-size: 13px; font-variant-numeric: tabular-nums; text-align: right; }
  header button { background: none; border: 0; color: var(--link); font: inherit; padding: 6px 0; }
  .empty { color: var(--hint); text-align: center; margin-top: 30vh; }
  form { display: flex; gap: 8px; align-items: flex-end; padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--code); background: var(--bg); }
  textarea { flex: 1; resize: none; max-height: 40vh; border: 1px solid var(--code); border-radius: 18px;
    padding: 9px 14px; background: var(--bubble); color: var(--text); font: inherit; }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; }
  form button { border: 0; border-radius: 18px; background: var(--accent); color: var(--accent-text);
    font: 600 15px system-ui, sans-serif; padding: 10px 16px; min-height: 40px; }
  form button:focus-visible, header button:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
  form button:disabled { opacity: 0.5; }
  [hidden] { display: none !important; }
  #apps { flex: 1; overflow-y: auto; padding: 16px; }
  .make { background: var(--bubble); border-radius: 16px; padding: 14px; margin-bottom: 18px; }
  .make label { display: block; font-weight: 600; margin-bottom: 8px; }
  .make textarea { width: 100%; min-height: 64px; background: var(--bg); }
  .make .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 10px; }
  .make .row span { color: var(--hint); font-size: 13px; }
  .btn { border: 0; border-radius: 12px; background: var(--accent); color: var(--accent-text);
    font: 600 15px system-ui, sans-serif; padding: 10px 16px; min-height: 44px; }
  .btn:disabled { opacity: .5; }
  .btn:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
  .ideas { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .ideas button { border: 1px solid var(--code); background: var(--bg); color: var(--text); border-radius: 999px;
    padding: 6px 12px; font: 14px system-ui, sans-serif; min-height: 34px; }
  h2.section { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--hint); margin: 0 0 8px; }
  .app { display: flex; align-items: center; gap: 4px; padding: 10px 4px 10px 12px; border-radius: 14px;
    background: var(--bubble); margin-bottom: 8px; }
  .icon { width: 44px; height: 44px; border-radius: 12px; background: var(--bg); color: var(--text);
    display: grid; place-items: center; font: 24px/1 system-ui, sans-serif; flex: none; }
  .icon.letter { background: var(--accent); color: var(--accent-text); font: 700 19px system-ui, sans-serif; }
  .app .text { display: block; min-width: 0; }
  .app .name { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .app .desc { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    color: var(--hint); font-size: 14px; line-height: 1.35; }
  .app .when { display: block; color: var(--hint); font-size: 12px; margin-top: 2px; }
  .app .open { flex: 1; min-width: 0; background: none; border: 0; text-align: left; color: inherit; font: inherit;
    display: flex; align-items: center; gap: 12px; padding: 0; min-height: 44px; border-radius: 10px; }
  .app .more { flex: none; width: 44px; height: 44px; border: 0; border-radius: 22px; background: none;
    color: var(--link); font: 700 20px/1 system-ui, sans-serif; letter-spacing: 1px; }
  .app .open:focus-visible, .app .more:focus-visible,
  .sheet button:focus-visible, .sheet input:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
  .none { color: var(--hint); }
  .make[aria-busy="true"] textarea { opacity: .7; }
  .notice-row { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; }
  .notice-row:has(.notice:empty) { display: none; }
  .notice { color: var(--hint); font-size: 14px; margin: 0; flex: 1; min-width: 0; }
  .notice:empty { display: none; }
  .notice-row button { background: none; border: 0; color: var(--link); font: 600 15px system-ui, sans-serif;
    min-height: 44px; padding: 0 8px; }
  .result { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .result .btn.plain { background: none; color: var(--link); padding: 10px 8px; }
  .app .more:disabled { color: var(--hint); }
  .sheet[aria-busy="true"] .actions button, .sheet[aria-busy="true"] .rename .btn { opacity: .5; }
  .notice-row button:focus-visible, .result .btn:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  /* the "…" action sheet: a native <dialog> (focus trapped, Escape closes), laid out like a phone's sheet */
  dialog.sheet { margin: auto auto 0; width: 100%; max-width: 520px; border: 0; padding: 0; background: transparent;
    color: var(--text); }
  dialog.sheet::backdrop { background: rgba(0, 0, 0, .35); }
  .sheet .panel { background: var(--bg); border-radius: 16px 16px 0 0;
    padding: 14px 12px calc(12px + env(safe-area-inset-bottom)); box-shadow: 0 -4px 24px rgba(0,0,0,.18); }
  .sheet .head { display: flex; align-items: center; gap: 12px; padding: 2px 4px 12px; }
  .sheet h2 { font-size: 17px; margin: 0; overflow-wrap: anywhere; }
  .sheet .actions { background: var(--sheet); border-radius: 12px; overflow: hidden; }
  .sheet .actions button { display: block; width: 100%; min-height: 50px; border: 0; background: none;
    color: var(--link); font: 17px system-ui, sans-serif; text-align: center; }
  .sheet .actions button + button { border-top: 1px solid var(--code); }
  .sheet .actions button.danger { color: var(--danger); }
  .sheet .cancel { display: block; width: 100%; min-height: 50px; margin-top: 8px; border: 0; border-radius: 12px;
    background: var(--sheet); color: var(--link); font: 600 17px system-ui, sans-serif; }
  .sheet .rename { background: var(--sheet); border-radius: 12px; padding: 12px; }
  .sheet .rename label { display: block; font-weight: 600; margin-bottom: 8px; }
  .sheet .rename input { width: 100%; min-height: 44px; border: 1px solid var(--code); border-radius: 10px;
    padding: 8px 12px; background: var(--bg); color: var(--text); font: inherit; }
  .sheet .rename .row { display: flex; justify-content: flex-end; margin-top: 10px; }
  .sheet .error { color: var(--danger); font-size: 14px; margin: 8px 4px 0; }
  .sheet .error:empty { display: none; }
  /* one app's change chat (?chat=<slug>): what was asked of it, how each build went, and the next change */
  body.chatting > header, body.chatting #apps { display: none; }
  #chat { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .chat-head { display: flex; align-items: center; gap: 10px; padding: 6px 12px 6px 4px;
    border-bottom: 1px solid var(--code); }
  .chat-head .back { flex: none; width: 44px; height: 44px; border: 0; border-radius: 22px; background: none;
    color: var(--link); font: 32px/1 system-ui, sans-serif; padding: 0 0 4px; }
  .chat-head .icon { width: 36px; height: 36px; border-radius: 10px; font-size: 20px; }
  .chat-head .icon.letter { font-size: 16px; }
  .chat-name { flex: 1; min-width: 0; }
  .chat-name h1 { font-size: 17px; line-height: 1.3; margin: 0; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; outline: none; }
  .chat-name span { display: block; color: var(--hint); font-size: 13px; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; font-variant-numeric: tabular-nums; }
  .chat-head .btn { flex: none; padding: 8px 14px; }
  .thread { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; list-style: none; margin: 0;
    padding: 14px 12px 10px; display: flex; flex-direction: column; gap: 8px; }
  .thread .quiet { color: var(--hint); text-align: center; margin: auto 16px; font-size: 15px; }
  .msg { max-width: 86%; padding: 8px 12px; border-radius: 18px; overflow-wrap: anywhere; line-height: 1.4; }
  .msg.asked { align-self: flex-end; background: var(--accent); color: var(--accent-text);
    border-bottom-right-radius: 6px; white-space: pre-wrap; }
  .msg.built { align-self: flex-start; background: var(--bubble); border-bottom-left-radius: 6px; }
  .msg.built.failed .line { color: var(--danger); }
  .msg.built[aria-busy="true"] .line { color: var(--hint); font-variant-numeric: tabular-nums; }
  .msg .line { display: block; }
  .msg .more-line { display: block; font-size: 14px; color: var(--hint); margin-top: 2px; }
  .msg .when { display: block; font-size: 12px; margin-top: 3px; opacity: .72; font-variant-numeric: tabular-nums; }
  .msg.built .when { color: var(--hint); opacity: 1; }
  .msg.note { align-self: center; max-width: 92%; background: none; color: var(--hint); font-size: 13px;
    text-align: center; padding: 2px 8px; }
  .msg .btn { margin: 8px 6px 0 0; }
  .msg .btn.plain { background: none; color: var(--link); padding: 10px 8px; }
  .chat-hint { margin: 0; padding: 6px 16px 0; color: var(--hint); font-size: 13px; }
  .chat-hint:empty { display: none; }
  .chat-head .back:focus-visible, .chat-head .btn:focus-visible, .msg .btn:focus-visible {
    outline: 2px solid var(--link); outline-offset: 2px; }
  /* the Spending view: opened from the header's "$X spent today" */
  header .spent { background: none; border: 0; font: inherit; font-size: 13px; color: var(--link); min-height: 44px;
    padding: 0 0 0 8px; cursor: pointer; }
  header .spent:disabled { color: var(--hint); cursor: default; }
  header .spent:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
  body.spending > header, body.spending #apps { display: none; }
  #spending { flex: 1; min-height: 0; overflow-y: auto; padding: 0 16px calc(24px + env(safe-area-inset-bottom)); }
  #spending .chat-head { margin: 0 -16px 12px; }
  .hero { margin: 4px 0 18px; }
  .hero .big { font: 700 34px/1.1 system-ui, sans-serif; font-variant-numeric: tabular-nums; margin: 0; }
  .hero .sub { color: var(--hint); font-size: 14px; margin: 4px 0 0; }
  .card { background: var(--bubble); border-radius: 14px; padding: 12px 14px; margin-bottom: 14px; }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--hint); margin: 0 0 8px; }
  .split { list-style: none; margin: 0; padding: 0; }
  .split li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding: 5px 0; }
  .split .name { overflow-wrap: anywhere; }
  .split .val { font-variant-numeric: tabular-nums; text-align: right; }
  .split .bar { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--code); overflow: hidden; }
  .split .bar span { display: block; height: 100%; border-radius: 3px; background: var(--accent); }
  .chart svg { display: block; width: 100%; height: 140px; }
  .chart .bar-mark { fill: var(--accent); }
  .chart .bar-mark.today { fill: var(--link); }
  .chart .base { stroke: var(--code); stroke-width: 1; }
  .chart .axis { fill: var(--hint); font: 11px system-ui, sans-serif; }
  .chart .hit { fill: transparent; cursor: pointer; }
  .chart .hit:focus-visible { outline: none; stroke: var(--link); stroke-width: 2; }
  .chart .readout { color: var(--hint); font-size: 13px; min-height: 1.4em; margin: 6px 0 0; font-variant-numeric: tabular-nums; }
  .rows { display: grid; gap: 10px; }
  .prov .head { display: flex; justify-content: space-between; gap: 10px; font-weight: 600; }
  .prov p { margin: 2px 0 0; color: var(--hint); font-size: 14px; font-variant-numeric: tabular-nums; }
  .note { color: var(--hint); font-size: 13px; margin: 6px 0 0; }
  @media (prefers-reduced-motion: no-preference) {
    dialog.sheet[open] .panel { animation: rise .18s ease-out; }
    @keyframes rise { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }
  }
  /* Call eve (phone_call.py): a button in the header, then a full-screen call */
  header .ends { display: flex; align-items: center; gap: 12px; }
  header .call-btn { background: var(--accent); color: var(--accent-text); border-radius: 999px; padding: 6px 14px;
    font-weight: 600; font-size: 14px; min-height: 36px; }
  header .call-btn:disabled { opacity: .5; }
  /* The Lights card (lights.py via /api/lights): which lights, on/off, a colour, a level */
  .lights .head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
  .lights h2 { margin: 0; font-size: 16px; }
  .lights .power { display: flex; gap: 6px; }
  .lights .power button { min-width: 56px; }
  .lights .ideas { margin-top: 0; }
  .lights .ideas button[aria-checked="true"] { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 8px; margin: 12px 0; }
  .swatches button { aspect-ratio: 1; min-height: 44px; border-radius: 50%; border: 2px solid var(--code); padding: 0; }
  .swatches button:focus-visible, .lights .ideas button:focus-visible, .lights .power button:focus-visible {
    outline: 2px solid var(--link); outline-offset: 2px; }
  .swatches button.custom { background: conic-gradient(red, yellow, lime, cyan, blue, magenta, red); }
  .swatches button.custom[aria-expanded="true"] { border-color: var(--link); }
  /* the colour wheel (iro.js, served by eve): hue round the ring, white at the centre */
  .wheel-wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; margin: 0 0 12px; }
  .wheel { border-radius: 50%; touch-action: none; }
  .wheel:focus-visible { outline: 2px solid var(--link); outline-offset: 3px; }
  .wheel-wrap .picked { font-size: 13px; color: var(--hint); font-variant-numeric: tabular-nums; }
  .lights .level { display: flex; align-items: center; gap: 10px; }
  .lights .level label { font-weight: 400; margin: 0; font-size: 14px; color: var(--hint); flex: none; }
  .lights input[type="range"] { flex: 1; accent-color: var(--accent); min-height: 44px; }
  .lights .level output { font-variant-numeric: tabular-nums; min-width: 3.2em; text-align: right; font-size: 14px; }
  .lights .said { color: var(--hint); font-size: 13px; margin: 6px 0 0; min-height: 1.5em; }
  /* The Music card (spotify.py via /api/spotify): spotKnob's face — the track, prev / play-pause / next, volume,
     and where it plays */
  .music .now { display: flex; gap: 12px; align-items: center; margin-bottom: 10px; min-height: 64px; }
  .music .art { width: 64px; height: 64px; border-radius: 8px; object-fit: cover; flex: none; background: var(--code); }
  .music .art[hidden] { display: none; }
  .music .titles { min-width: 0; }
  .music h2 { margin: 0 0 2px; font-size: 16px; }
  .music .track { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .music .by { color: var(--hint); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .music .transport { display: flex; justify-content: center; gap: 12px; margin: 4px 0 8px; }
  .music .transport button { min-width: 56px; min-height: 44px; font-size: 18px; }
  .music .transport button:focus-visible, .music select:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
  .music .level { display: flex; align-items: center; gap: 10px; }
  .music .level label { font-weight: 400; margin: 0; font-size: 14px; color: var(--hint); flex: none; }
  .music input[type="range"] { flex: 1; accent-color: var(--accent); min-height: 44px; }
  .music .level output { font-variant-numeric: tabular-nums; min-width: 3.2em; text-align: right; font-size: 14px; }
  .music .where { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
  .music .where label { font-weight: 400; margin: 0; font-size: 14px; color: var(--hint); flex: none; }
  .music select { flex: 1; min-height: 44px; font: inherit; color: var(--text); background: var(--bubble);
    border: 1px solid var(--code); border-radius: 10px; padding: 0 10px; min-width: 0; }
  .music .key { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-top: 8px; font-size: 13px; color: var(--hint); }
  .music .key span { display: inline-flex; align-items: center; gap: 6px; }
  .music .key i { width: 10px; height: 10px; border-radius: 50%; flex: none; border: 1px solid var(--code); }
  .music .vpe { margin-top: 8px; width: 100%; min-height: 44px; }
  .music .vpe[aria-pressed="true"] { background: #1ed760; color: #000; border-color: #1ed760; }
  .music .vpe:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
  .music .said { color: var(--hint); font-size: 13px; margin: 6px 0 0; min-height: 1.5em; }
  /* The TV remote card (firetv.py via /api/firetv): a Fire TV remote on the phone. Every target is 44 px or more,
     a press lights up at once (.hit) while the TV takes its second, and the line under it says what the TV did. */
  .tv .head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 10px; }
  .tv h2 { margin: 0; font-size: 16px; }
  .tv .now { margin: 2px 0 0; color: var(--hint); font-size: 14px; font-variant-numeric: tabular-nums; }
  .tv button { -webkit-tap-highlight-color: transparent; touch-action: manipulation; user-select: none;
    -webkit-user-select: none; font: 600 15px system-ui, sans-serif; color: var(--text); cursor: pointer; }
  .tv button:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
  .tv svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round;
    stroke-linejoin: round; pointer-events: none; }
  .tv .power { flex: none; width: 52px; height: 52px; border-radius: 50%; border: 0; background: var(--bg);
    color: var(--hint); display: grid; place-items: center; box-shadow: inset 0 0 0 1px var(--code); }
  .tv .power[aria-pressed="true"] { background: var(--danger); color: #fff; box-shadow: none; }
  .tv .chips { display: flex; gap: 6px; overflow-x: auto; margin: 0 -14px 14px; padding: 2px 14px 4px;
    scrollbar-width: none; scroll-snap-type: x proximity; scroll-padding-inline: 14px; }
  .tv .chips::-webkit-scrollbar { display: none; }
  .tv .chips button { flex: none; min-height: 44px; padding: 0 16px; border-radius: 999px; scroll-snap-align: start;
    border: 1px solid var(--code); background: var(--bg); font-weight: 500; }
  .tv .chips button[aria-current="true"] { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .tv .pad { position: relative; width: min(232px, 70vw); aspect-ratio: 1; margin: 0 auto 14px; border-radius: 50%;
    background: var(--bg); box-shadow: inset 0 0 0 1px var(--code); }
  .tv .pad .dir { position: absolute; border: 0; background: none; color: var(--hint); display: grid; place-items: center;
    width: 34%; height: 34%; border-radius: 50%; }
  .tv .pad .dir svg { width: 28px; height: 28px; stroke-width: 2.4; }
  .tv .pad .up { top: 0; left: 33%; } .tv .pad .down { bottom: 0; left: 33%; }
  .tv .pad .left { left: 0; top: 33%; } .tv .pad .right { right: 0; top: 33%; }
  .tv .pad .ok { position: absolute; inset: 31%; border-radius: 50%; border: 0; background: var(--accent);
    color: var(--accent-text); font-size: 17px; letter-spacing: .02em; }
  .tv .keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 10px; }
  .tv .keys button { min-height: 48px; border-radius: 14px; border: 0; background: var(--bg); display: grid;
    place-items: center; box-shadow: inset 0 0 0 1px var(--code); }
  .tv .keys button[aria-pressed="true"] { color: var(--danger); }
  .tv button.hit, .tv button:active { transform: scale(.94); filter: brightness(.9); }
  .tv .pad .dir.hit, .tv .pad .dir:active { background: var(--code); color: var(--text); }
  @media (prefers-reduced-motion: no-preference) { .tv button { transition: transform .08s ease-out, background .12s; } }
  .tv .level { display: flex; align-items: center; gap: 10px; }
  .tv .level label { font-weight: 400; margin: 0; font-size: 14px; color: var(--hint); flex: none; }
  .tv input[type="range"] { flex: 1; accent-color: var(--accent); min-height: 44px; }
  .tv .level output { font-variant-numeric: tabular-nums; min-width: 3.2em; text-align: right; font-size: 14px; }
  .tv .said { color: var(--hint); font-size: 13px; margin: 6px 0 0; min-height: 1.5em; }
  .tv .said.err { color: var(--danger); }
  .call { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px; padding: 24px 16px calc(24px + env(safe-area-inset-bottom)); }
  .call .face { width: 132px; height: 132px; border-radius: 50%; background: var(--accent); color: var(--accent-text);
    display: grid; place-items: center; font: 700 40px system-ui, sans-serif; transition: transform .2s; }
  .call[data-state="speaking"] .face { animation: talk 0.9s ease-in-out infinite; }
  .call[data-state="thinking"] .face { opacity: .75; }
  @keyframes talk { 50% { transform: scale(1.07); } }
  @media (prefers-reduced-motion: reduce) { .call[data-state="speaking"] .face { animation: none; } }
  .call h2 { margin: 0; font-size: 22px; }
  .call .status { color: var(--hint); min-height: 1.5em; text-align: center; max-width: 30ch; }
  .call .time { font-variant-numeric: tabular-nums; color: var(--hint); font-size: 14px; }
  .call .heard { min-height: 3em; max-width: 34ch; text-align: center; font-size: 15px; }
  .call .controls { display: flex; flex-direction: column; align-items: center; gap: 22px; margin-top: 12px; }
  .call .controls button { border: 0; font: 600 15px system-ui, sans-serif; }
  .call .controls button:focus-visible { outline: 3px solid var(--link); outline-offset: 3px; }
  .call .talk { width: 132px; height: 132px; border-radius: 50%; background: var(--bubble); color: var(--text);
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  .call .talk[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); transform: scale(1.06); }
  .call .end { background: #d93a3a; color: #fff; border-radius: 999px; padding: 10px 26px; }
</style>
</head>
<body>
<header>
  <h1 class="who">Your apps</h1>
  <div class="ends">
    <button type="button" class="spent" id="spent" aria-label="Spent today. Open spending" disabled></button>
    <button type="button" class="call-btn" id="call-open">Call eve</button>
  </div>
</header>
<div class="call" id="call" data-state="idle" role="dialog" aria-modal="true" aria-labelledby="call-title" hidden>
  <div class="face" aria-hidden="true">b</div>
  <h2 id="call-title">eve</h2>
  <p class="status" id="call-status" role="status" aria-live="polite">Calling…</p>
  <span class="time" id="call-time">0:00</span>
  <p class="heard" id="call-heard" aria-live="polite"></p>
  <div class="controls">
    <button type="button" class="talk" id="call-talk" aria-pressed="false">Hold to talk</button>
    <button type="button" class="end" id="call-end">End</button>
  </div>
</div>
<section id="apps">
  <div class="make lights" id="lights-card" role="region" aria-labelledby="lights-title" hidden>
    <div class="head"><h2 id="lights-title">Lights</h2>
      <div class="power"><button type="button" class="btn" id="lights-on">On</button>
        <button type="button" class="btn" id="lights-off">Off</button></div></div>
    <div class="ideas" id="light-targets" role="radiogroup" aria-label="Which lights"></div>
    <div class="swatches" id="swatches" role="group" aria-label="Colour"></div>
    <div class="wheel-wrap" id="wheel-wrap" hidden>
      <div class="wheel" id="wheel" role="slider" tabindex="0" aria-label="Colour wheel: arrow keys turn the hue,
        up and down set how deep the colour is" aria-valuemin="0" aria-valuemax="359" aria-valuenow="0"></div>
      <div class="picked" id="wheel-picked"></div></div>
    <div class="level"><label for="level">Brightness</label>
      <input type="range" id="level" min="1" max="100" step="1" value="100"><output id="level-out" for="level">100%</output></div>
    <p class="said" id="lights-said" role="status" aria-live="polite"></p>
  </div>
  <div class="make music" id="music-card" role="region" aria-labelledby="music-title" hidden>
    <div class="now" id="music-now">
      <div class="titles"><h2 id="music-title">Music</h2>
        <div class="track" id="music-track">Nothing playing</div><div class="by" id="music-by"></div></div></div>
    <div class="transport" role="group" aria-label="Playback">
      <button type="button" class="btn" id="music-prev" aria-label="Previous track">⏮</button>
      <button type="button" class="btn" id="music-play" aria-label="Play">▶</button>
      <button type="button" class="btn" id="music-next" aria-label="Next track">⏭</button></div>
    <div class="level"><label for="music-volume">Volume</label>
      <input type="range" id="music-volume" min="0" max="100" step="2" value="50"><output id="music-volume-out" for="music-volume">50%</output></div>
    <div class="where"><label for="music-device">Playing on</label><select id="music-device"></select></div>
    <div class="key" id="music-key" aria-label="Each device's colour on the Voice PE"></div>

  </div>
  <div class="make tv" id="tv-card" role="region" aria-labelledby="tv-title" hidden>
    <div class="head"><div><h2 id="tv-title">TV</h2><p class="now" id="tv-now">Reading the TV…</p></div>
      <button type="button" class="power" id="tv-power" aria-pressed="false" aria-label="Turn the TV on"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v8"/><path d="M6.3 7.3a8 8 0 1 0 11.4 0"/></svg></button></div>
    <div class="chips" id="tv-apps" role="group" aria-label="Open an app"></div>
    <div class="pad" role="group" aria-label="Direction pad">
      <button type="button" class="dir up" data-tv="up" aria-label="Up"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 15 6-6 6 6"/></svg></button>
      <button type="button" class="dir left" data-tv="left" aria-label="Left"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></button>
      <button type="button" class="dir right" data-tv="right" aria-label="Right"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button>
      <button type="button" class="dir down" data-tv="down" aria-label="Down"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
      <button type="button" class="ok" data-tv="select" aria-label="OK">OK</button></div>
    <div class="keys">
      <button type="button" data-tv="back" aria-label="Back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
      <button type="button" data-tv="home" aria-label="Home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 11 9-7 9 7"/><path d="M5 10v10h14V10"/></svg></button>
      <button type="button" data-tv="menu" aria-label="Menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <button type="button" data-tv="rewind" aria-label="Rewind"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 6 4 12l7 6z"/><path d="M20 6l-7 6 7 6z"/></svg></button>
      <button type="button" data-tv="play_pause" aria-label="Play or pause"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l8 7-8 7z"/><path d="M16 6v12M20 6v12"/></svg></button>
      <button type="button" data-tv="fast_forward" aria-label="Fast-forward"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 6l7 6-7 6z"/><path d="M4 6l7 6-7 6z"/></svg></button>
      <button type="button" id="tv-quieter" aria-label="Volume down"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 12h4"/></svg></button>
      <button type="button" id="tv-mute" aria-pressed="false" aria-label="Mute"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="m17 9 4 6M21 9l-4 6"/></svg></button>
      <button type="button" id="tv-louder" aria-label="Volume up"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 12h4M19 10v4"/></svg></button></div>
    <div class="level"><label for="tv-volume">Volume</label>
      <input type="range" id="tv-volume" min="0" max="100" step="1" value="0"><output id="tv-volume-out" for="tv-volume">–</output></div>
    <p class="said" id="tv-said" role="status" aria-live="polite"></p>
  </div>
  <div class="make" id="make-card">
    <label for="want" id="want-label">What should I build?</label>
    <textarea id="want" rows="2" placeholder="A habit tracker with daily check-ins and streaks"></textarea>
    <div class="ideas" id="ideas">
      <button type="button">Habit tracker with streaks</button>
      <button type="button">Workout log</button>
      <button type="button">Reading list</button>
      <button type="button">Expense splitter</button>
    </div>
    <div class="row"><span id="make-status"></span>
      <button class="btn" id="make" type="button">Build it</button></div>
    <div class="result" id="make-result" hidden></div>
    <div class="sr" id="make-live" role="status" aria-live="polite"></div>
  </div>
  <h2 class="section" id="apps-heading" tabindex="-1">Your apps</h2>
  <div class="notice-row"><p class="notice" id="apps-notice" role="status" aria-live="polite"></p>
    <button type="button" id="notice-undo" hidden>Undo</button></div>
  <div id="app-list"><div class="none">Nothing yet. Describe one above.</div></div>
</section>
<section id="chat" aria-labelledby="chat-title" hidden>
  <div class="chat-head">
    <button type="button" class="back" id="chat-back" aria-label="Back to your apps"><span aria-hidden="true">‹</span></button>
    <span class="icon" id="chat-icon" aria-hidden="true"></span>
    <div class="chat-name"><h1 id="chat-title" tabindex="-1"></h1><span id="chat-sub"></span></div>
    <button type="button" class="btn" id="chat-open">Open</button>
  </div>
  <ol class="thread" id="thread" aria-label="What was asked of this app and how each change went"></ol>
  <p class="chat-hint" id="chat-hint"></p>
  <form id="composer">
    <label class="sr" for="ask">What should change?</label>
    <textarea id="ask" rows="1" maxlength="4000" enterkeyhint="send" placeholder="What should change?"></textarea>
    <button type="submit" id="ask-send">Change</button>
  </form>
  <div class="sr" id="chat-live" role="status" aria-live="polite"></div>
</section>
<section id="spending" aria-labelledby="spend-title" hidden>
  <div class="chat-head">
    <button type="button" class="back" id="spend-back" aria-label="Back to your apps"><span aria-hidden="true">‹</span></button>
    <div class="chat-name"><h1 id="spend-title" tabindex="-1">Spending</h1><span>What eve has spent, by its own meter</span></div>
  </div>
  <div id="spend-body"><p class="note" role="status">Loading…</p></div>
</section>
<dialog class="sheet" id="sheet" aria-labelledby="sheet-title">
  <div class="panel">
    <div class="head"><span class="icon" id="sheet-icon" aria-hidden="true"></span><h2 id="sheet-title"></h2></div>
    <div class="actions" id="sheet-actions">
      <button type="button" data-act="change">Change</button>
      <button type="button" data-act="rename">Rename</button>
      <button type="button" data-act="undo" id="act-undo">Undo last change</button>
      <button type="button" data-act="delete" class="danger">Delete</button>
    </div>
    <form class="rename" id="sheet-rename" hidden>
      <label for="rename-input">New name</label>
      <input id="rename-input" maxlength="60" autocomplete="off" enterkeyhint="done">
      <div class="row"><button class="btn" type="submit" id="rename-save">Save</button></div>
    </form>
    <p class="error" id="sheet-error" role="alert"></p>
    <button type="button" class="cancel" id="sheet-cancel">Cancel</button>
  </div>
</dialog>
<script>
(() => {
  const tg = window.Telegram && window.Telegram.WebApp;
  const initData = tg ? tg.initData : "";
  if (tg) { tg.ready(); tg.expand(); }
  const $ = (id) => document.getElementById(id);
  const spent = $("spent");
  const can = (v) => !!(tg && tg.isVersionAtLeast && tg.isVersionAtLeast(v));
  // What today's building has cost. Spend is tracked, not capped, unless a cap was set.
  // The header's figure is ALL of eve's spend today (spend.py's meter), not only the app builds. With a build
  // cap set, the builds' share is shown against it. A tap opens the Spending view.
  function showSpent(d) {
    if (!d || typeof d.spent_today !== "number") return;
    const capped = typeof d.cap === "number" && typeof d.apps_today === "number"
      ? " · builds $" + d.apps_today.toFixed(2) + " of $" + d.cap.toFixed(2) : "";
    spent.textContent = "$" + d.spent_today.toFixed(2) + " spent today" + capped;
    spent.setAttribute("aria-label", spent.textContent + ". Open spending");
    spent.disabled = false;
  }

  if (!initData) { spent.textContent = "Open this from eve's pinned message in Telegram."; spent.disabled = true; $("make").disabled = true; }
  else fetch("api/me", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ initData }) })
    .then((r) => r.json()).then((j) => {
      if (j.error) { spent.textContent = j.error; return; }
      showSpent(j);
      if (Array.isArray(j.lights) && j.lights.length) showLights(j.lights);
      if (j.spotify === true) showMusic();
      if (j.firetv === true) showTv();
    }).catch(() => {});

  // ---- the Lights card: every light at once by default (owner, 2026-09-27: "usually i set all the lights to be
  // same color"), or one light or room. Names come from the owner's own lights file; still textContent only.
  const SWATCHES = [["red", "#ff2a2a"], ["orange", "#ff7a1a"], ["yellow", "#ffd21a"], ["green", "#1ed760"],
    ["cyan", "#1ae0ff"], ["blue", "#2a5cff"], ["purple", "#8c2aff"], ["pink", "#ff4fa3"],
    ["warm white", "#ffd9a0"], ["white", "#fff6ea"]];
  let lightTarget = "all";
  function showLights(list) {
    const card = $("lights-card"), targets = $("light-targets"), said = $("lights-said");
    const choices = [["all", "All"]];
    const rooms = [...new Set(list.map((l) => l.room).filter(Boolean))];
    if (list.length > 1) rooms.forEach((r) => choices.push([r, r[0].toUpperCase() + r.slice(1)]));
    if (list.length > 1) list.forEach((l) => choices.push([l.name, l.name[0].toUpperCase() + l.name.slice(1)]));
    targets.hidden = choices.length < 2;
    choices.forEach(([value, label]) => {
      const b = el("button", "", label);
      b.type = "button"; b.setAttribute("role", "radio"); b.setAttribute("aria-checked", String(value === lightTarget));
      b.onclick = () => {
        lightTarget = value;
        targets.querySelectorAll("button").forEach((x) => x.setAttribute("aria-checked", String(x === b)));
      };
      targets.append(b);
    });
    const swatches = $("swatches");
    SWATCHES.forEach(([name, hex]) => {
      const b = el("button", "");
      b.type = "button"; b.style.background = hex; b.setAttribute("aria-label", name); b.title = name;
      b.onclick = () => setLights({ color: name });
      swatches.append(b);
    });
    const custom = el("button", "custom");
    custom.type = "button"; custom.setAttribute("aria-label", "Pick any colour"); custom.title = "Pick any colour";
    custom.setAttribute("aria-expanded", "false"); custom.setAttribute("aria-controls", "wheel-wrap");
    custom.onclick = () => {
      const open = $("wheel-wrap").hidden;
      $("wheel-wrap").hidden = !open; custom.setAttribute("aria-expanded", String(open));
      if (open) paintWheel();
    };
    if (wireWheel()) swatches.append(custom);
    const level = $("level"), out = $("level-out");
    level.oninput = () => { out.textContent = level.value + "%"; };
    level.onchange = () => setLights({ brightness: Number(level.value) });
    $("lights-on").onclick = () => setLights({ power: true });
    $("lights-off").onclick = () => setLights({ power: false });
    card.hidden = false;
    // what they are now: the first light that answers sets the slider
    post("api/lights", { action: "status" }).then(reply).then((j) => {
      const seen = (j.lights || []).filter((l) => l.reachable);
      if (seen.length && typeof seen[0].brightness === "number") {
        level.value = Math.max(1, seen[0].brightness); out.textContent = level.value + "%";
      }
      said.textContent = (j.lights || []).map((l) => l.name + ": " + (!l.reachable ? "not answering"
        : !l.on ? "off" : [l.color || (l.white_kelvin ? "white" : ""), typeof l.brightness === "number" ? l.brightness + "%" : ""]
          .filter(Boolean).join(" "))).join(" · ");
    }).catch(() => {});
  }
  // ---- the colour wheel: iro.js (vendored, served at /iro.js). Hue is the angle, red at the top; saturation the
  // distance from the centre. Brightness stays on the slider, so the wheel's value is always full.
  let wheel = null, wheelBusy = false, wheelNext = null;
  function paintWheel() {
    const c = wheel.color, hex = c.hexString, w = $("wheel");
    w.setAttribute("aria-valuenow", String(Math.round(c.hue)));
    w.setAttribute("aria-valuetext", hex + ", " + Math.round(c.saturation) + "% deep");
    $("wheel-picked").textContent = hex;
    return hex;
  }
  // while a drag goes on, one request is in flight and only the newest colour waits behind it: a Bluetooth
  // light takes a moment, and a queue of every colour passed on the way would replay the whole drag
  async function sendWheel(hex, done) {
    if (wheelBusy) { wheelNext = { hex, done: done || (wheelNext && wheelNext.done) }; return; }
    wheelBusy = true;
    try {
      const j = await reply(await post("api/lights", { action: "set", target: lightTarget, color: hex }));
      $("lights-said").textContent = j.line || j.error || "Something went wrong.";
      if (done && tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred(j.ok ? "success" : "error");
    } catch (e) {
      $("lights-said").textContent = "eve didn't answer. Is the Mac awake?";
    } finally {
      wheelBusy = false;
      const n = wheelNext; wheelNext = null;
      if (n) sendWheel(n.hex, n.done);
    }
  }
  function wireWheel() {
    const w = $("wheel");
    if (typeof window.iro === "undefined") return false;       // an older eve that does not serve iro.js yet
    const size = Math.min(240, Math.round(window.innerWidth * 0.7));
    wheel = new window.iro.ColorPicker(w, { width: size, color: { h: 0, s: 100, v: 100 }, borderWidth: 2,
      borderColor: getComputedStyle(document.body).getPropertyValue("--code").trim() || "#8884",
      handleRadius: 12, wheelDirection: "clockwise", wheelAngle: 270, layout: [{ component: window.iro.ui.Wheel }] });
    wheel.on("input:start", () => { if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred("light"); });
    wheel.on("input:move", () => sendWheel(paintWheel(), false));
    wheel.on("input:end", () => sendWheel(paintWheel(), true));
    w.addEventListener("keydown", (e) => {
      const step = { ArrowRight: [10, 0], ArrowLeft: [-10, 0], ArrowUp: [0, 10], ArrowDown: [0, -10] }[e.key];
      if (!step) return;
      e.preventDefault();
      const c = wheel.color;
      c.hsv = { h: (c.hue + step[0] + 360) % 360, s: Math.max(0, Math.min(100, c.saturation + step[1])), v: 100 };
      sendWheel(paintWheel(), true);
    });
    paintWheel();
    return true;
  }
  async function setLights(change) {
    const said = $("lights-said");
    said.textContent = "…";
    if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred("light");
    try {
      const j = await reply(await post("api/lights", Object.assign({ action: "set", target: lightTarget }, change)));
      said.textContent = j.line || j.error || "Something went wrong.";
      if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred(j.ok ? "success" : "error");
    } catch (e) {
      said.textContent = "eve didn't answer. Is the Mac awake?";
    }
  }

  // ---- the Music card: spotKnob on the phone (owner, 2026-09-27: "give eve spotKnob capabilities"). Track,
  // artist and device names come from Spotify, so they only ever reach the page as textContent.
  let musicPlaying = false;
  function paintMusic(j) {
    if (!j || j.ok === false) return;
    // the art <img> is made only when there is art: the page holds no <img> of its own otherwise
    let art = $("music-art");
    if (!art) { art = el("img", "art"); art.id = "music-art"; art.alt = ""; art.hidden = true; $("music-now").prepend(art); }
    $("music-track").textContent = j.track || "Nothing playing";
    $("music-by").textContent = (j.artists || []).join(", ") + (j.album ? " · " + j.album : "");
    if (typeof j.art === "string" && j.art.indexOf("https://i.scdn.co/") === 0) { art.src = j.art; art.hidden = false; }
    else art.hidden = true;
    musicPlaying = !!j.playing;
    const play = $("music-play");
    play.textContent = musicPlaying ? "⏸" : "▶";
    play.setAttribute("aria-label", musicPlaying ? "Pause" : "Play");
    const vol = $("music-volume");
    if (j.device && typeof j.device.volume === "number" && document.activeElement !== vol) {
      vol.value = j.device.volume; $("music-volume-out").textContent = j.device.volume + "%";
    }
    // Spotify mode on the Voice PE (music_mode.py): only when the board is eve's controller (mode is a bool)
    const mode = $("music-mode");
    if (typeof j.mode === "boolean") {
      mode.hidden = false;
      mode.setAttribute("aria-pressed", String(j.mode));
      mode.textContent = j.mode ? "Voice PE Spotify mode: on" : "Voice PE Spotify mode: off";
    }
    const pick = $("music-device");
    if (Array.isArray(j.devices)) {
      pick.textContent = "";
      const active = j.devices.find((d) => d.active);
      if (!active) { const o = el("option", "", "No device playing"); o.value = ""; o.selected = true; pick.append(o); }
      j.devices.forEach((d) => {
        const o = el("option", "", d.name + (d.restricted ? " (no remote control)" : ""));
        o.value = d.name; o.disabled = !!d.restricted; o.selected = !!d.active;
        pick.append(o);
      });
      if (!j.devices.length) { const o = el("option", "", "Open Spotify somewhere"); o.value = ""; pick.append(o); }
      // each device's colour, as the Voice PE's ring shows it in the picker (spotify.DeviceColors)
      const key = $("music-key");
      key.textContent = "";
      j.devices.forEach((d) => {
        if (!/^#[0-9a-f]{6}$/.test(d.color || "")) return;
        const chip = el("span", ""), dot = el("i", "");
        dot.style.background = d.color;
        chip.append(dot, document.createTextNode(d.name));

<script>
// Call eve (phone_call.py): push to talk. While the button is held, the microphone goes to eve as 24 kHz
// 16-bit PCM over a WebSocket; on release eve transcribes it and handles it exactly like a text in the chat,
// then reads every reply back the same way. A press while eve talks interrupts it.
(() => {
  const tg = window.Telegram && window.Telegram.WebApp;
  const initData = tg ? tg.initData : "";
  const $ = (id) => document.getElementById(id);
  const RATE = 24000, BLOCK = 2400;                  // 100 ms blocks, as the desk's ears hand them out
  const box = $("call"), status = $("call-status"), timer = $("call-time"), talkBtn = $("call-talk");
  const heard = $("call-heard");
  const openBtn = $("call-open");
  const words = { connected: "Connected. Hold the button and talk.", listening: "Hold the button and talk.",
                  thinking: "Thinking…", speaking: "eve is talking. Hold to interrupt." };
  let ws = null, ctx = null, stream = null, proc = null, source = null, talking = false, started = 0, tick = null;
  let playhead = 0, playing = [], wake = null, ending = false, beat = null;

  if (!initData || !navigator.mediaDevices || !window.WebSocket || !(window.AudioContext || window.webkitAudioContext)) {
    openBtn.disabled = true;
    openBtn.title = !initData ? "Open this from eve's pinned message in Telegram." : "This browser can't make calls.";
  }

  function say(text, state) {
    status.textContent = text;
    if (state) box.dataset.state = state;
  }

  function flush() {
    for (const s of playing) { try { s.stop(); } catch (e) {} }
    playing = []; playhead = 0;
  }

  function play(buf) {
    const pcm = new Int16Array(buf);
    if (!pcm.length || !ctx) return;
    const audio = ctx.createBuffer(1, pcm.length, RATE);
    const ch = audio.getChannelData(0);
    for (let i = 0; i < pcm.length; i++) ch[i] = pcm[i] / 32768;
    const src = ctx.createBufferSource();
    src.buffer = audio; src.connect(ctx.destination);
    const at = Math.max(ctx.currentTime + 0.06, playhead);
    src.start(at); playhead = at + audio.duration;
    playing.push(src);
    src.onended = () => { playing = playing.filter((s) => s !== src); };
  }

  // The microphone, resampled from the device's rate to 24 kHz, sent in 100 ms blocks.
  function capture() {
    source = ctx.createMediaStreamSource(stream);
    proc = ctx.createScriptProcessor(4096, 1, 1);
    const step = ctx.sampleRate / RATE;
    let pos = 0, out = new Int16Array(BLOCK), n = 0, last = 0;
    proc.onaudioprocess = (e) => {
      const input = e.inputBuffer.getChannelData(0);
      e.outputBuffer.getChannelData(0).fill(0);
      if (!ws || ws.readyState !== 1 || !talking) { last = input[input.length - 1]; pos = 0; n = 0; return; }
      while (pos < input.length) {
        const i = Math.floor(pos), f = pos - i;
        const a = i === 0 ? last : input[i - 1], b = input[i];
        const v = Math.max(-1, Math.min(1, a + (b - a) * f));
        out[n++] = v < 0 ? v * 32768 : v * 32767;
        if (n === BLOCK) { ws.send(out.buffer.slice(0)); n = 0; }
        pos += step;
      }
      pos -= input.length; last = input[input.length - 1];
    };
    source.connect(proc); proc.connect(ctx.destination);
  }

  async function start() {
    ending = false;
    box.hidden = false; say("Calling…", "idle"); timer.textContent = "0:00";
    talking = false; talkBtn.setAttribute("aria-pressed", "false"); heard.textContent = "";
    talkBtn.focus();
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      await ctx.resume();
      stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true,
        autoGainControl: true, channelCount: 1 } });
    } catch (e) {
      finish("eve can't hear you: the microphone isn't allowed here. Allow it for Telegram in your phone's settings.");
      return;
    }
    try { wake = navigator.wakeLock && await navigator.wakeLock.request("screen"); } catch (e) { wake = null; }
    const url = new URL("api/call", location.href);
    url.protocol = url.protocol === "https:" ? "wss:" : "ws:";
    ws = new WebSocket(url.href);
    ws.binaryType = "arraybuffer";
    ws.onopen = () => {
      ws.send(JSON.stringify({ initData })); capture();
      // a heartbeat: eve ends a call it has not heard from in 30 s (a page closed without saying goodbye)
      beat = setInterval(() => { if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: "ping" })); }, 10000);
    };
    ws.onmessage = (e) => {
      if (typeof e.data !== "string") { if (!talking) play(e.data); return; }
      let m = {}; try { m = JSON.parse(e.data); } catch (err) { return; }
      if (m.type === "state") {
        if (m.state === "connected") { started = Date.now(); tick = setInterval(showTime, 1000); }
        if (!talking) say(m.note || words[m.state] || "", m.state);
      } else if (m.type === "heard") heard.textContent = "“" + m.text + "”";
      else if (m.type === "flush") flush();
      else if (m.type === "ended") finish(m.reason || "Call ended.");
    };
    ws.onclose = () => { if (!ending) finish(started ? "Call ended." : "eve couldn't be reached. Is the Mac awake?"); };
  }

  function showTime() {
    const s = Math.floor((Date.now() - started) / 1000);
    timer.textContent = Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  }

  function finish(reason) {
    ending = true;
    if (ws && ws.readyState <= 1) { try { ws.send(JSON.stringify({ type: "end" })); } catch (e) {} ws.close(); }
    ws = null;
    if (proc) { proc.disconnect(); proc.onaudioprocess = null; proc = null; }
    if (source) { source.disconnect(); source = null; }
    if (stream) { stream.getTracks().forEach((t) => t.stop()); stream = null; }
    flush();
    if (ctx) { ctx.close().catch(() => {}); ctx = null; }
    if (wake) { wake.release().catch(() => {}); wake = null; }
    clearInterval(tick); tick = null; started = 0;
    clearInterval(beat); beat = null;
    say(reason, "idle");
    setTimeout(() => { if (!ws) { box.hidden = true; openBtn.focus(); } }, 2500);
  }

  // Hold to talk: pointer or touch, and the space bar for a keyboard. A press interrupts eve.
  function press() {
    if (talking || !ws || ws.readyState !== 1) return;
    talking = true; flush();
    talkBtn.setAttribute("aria-pressed", "true"); talkBtn.textContent = "Listening…";
    say("Listening… let go when you're done.", "listening");
    ws.send(JSON.stringify({ type: "talk" }));
    if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred("light");
  }
  // A soft two-note blip the moment the button is let go: eve has it (the answer takes a few seconds more).
  function blip() {
    if (!ctx) return;
    try {
      const t = ctx.currentTime, g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.12, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
      g.connect(ctx.destination);
      [660, 880].forEach((f, i) => {
        const o = ctx.createOscillator();
        o.type = "sine"; o.frequency.value = f; o.connect(g);
        o.start(t + i * 0.09); o.stop(t + 0.1 + i * 0.09);
      });
    } catch (e) {}
  }
  function release() {
    if (!talking) return;
    talking = false;
    blip();
    talkBtn.setAttribute("aria-pressed", "false"); talkBtn.textContent = "Hold to talk";
    if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: "done" }));
  }
  talkBtn.addEventListener("pointerdown", (e) => { e.preventDefault(); talkBtn.setPointerCapture(e.pointerId); press(); });
  talkBtn.addEventListener("pointerup", release);
  talkBtn.addEventListener("pointercancel", release);
  talkBtn.addEventListener("contextmenu", (e) => e.preventDefault());
  talkBtn.addEventListener("keydown", (e) => { if ((e.key === " " || e.key === "Enter") && !e.repeat) { e.preventDefault(); press(); } });
  talkBtn.addEventListener("keyup", (e) => { if (e.key === " " || e.key === "Enter") release(); });
  openBtn.onclick = start;
  $("call-end").onclick = () => finish("Call ended.");
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !box.hidden) finish("Call ended."); });
  window.addEventListener("pagehide", () => { if (ws) finish("Call ended."); });
})();
</script>
</body>
</html>
