<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <!-- The page never reaches the network itself: native code does every
         request (connect-src 'none'). Scripts and styles come only from the
         bundled eveapp:// files. Images in replies may be https. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src eveapp:; script-src eveapp:; style-src eveapp: 'unsafe-inline'; img-src eveapp: data: blob: https:; font-src eveapp: data:; media-src eveapp: data: blob: https:; connect-src 'none'; frame-src 'none'; worker-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="format-detection" content="telephone=no, date=no, address=no, email=no" />
    <title>Eve</title>
    <script defer src="./chat.js"></script>
    <link rel="stylesheet" href="./chat.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
