# lang-core's postinstall only sends install telemetry; never run it.
allowBuilds:
  '@openuidev/lang-core': false
minimumReleaseAgeExclude:
  - '@openuidev/devtools@0.3.0'
  - '@openuidev/lang-core@1.0.1'
  - '@openuidev/react-headless@0.18.1'
  - '@openuidev/react-lang@1.0.1'
  - '@openuidev/react-ui@0.18.1'
  - vite@8.3.4
