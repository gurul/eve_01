[package]
name = "eve-desktop-lanes"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "eve_desktop_lanes"
path = "src/lib.rs"

# `python -m eve_bridge.ax_candidates`: walk one app's focused window and print its candidates.
[[bin]]
name = "eve-ax-candidates"
path = "src/bin/ax_candidates.rs"

[dependencies]
eve-browser-intent = { path = "../eve-browser-intent" }
eve-decider = { path = "../eve-decider" }
eve-decisions = { path = "../eve-decisions" }
eve-plan-contract = { path = "../eve-plan-contract" }
eve-typed-ask = { path = "../eve-typed-ask" }
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
regex.workspace = true
indexmap.workspace = true
parking_lot.workspace = true
chrono.workspace = true
image.workspace = true
tracing.workspace = true
clap.workspace = true
libc.workspace = true
# Python's `re` lookbehind / lookahead (SENSITIVE_LABEL, LOCAL_SCOPE, plan_executor._named_field).
fancy-regex = "0.19.2"
# pyperclip → arboard (desktop_helpers.type_text's clipboard paste).
arboard = { version = "3.7.0", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSEnumerator", "NSDictionary", "NSString", "NSError", "NSGeometry", "NSObject", "NSValue", "NSAttributedString"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFBase", "CFString", "CFArray", "CFNumber", "CFDictionary", "CFData", "CFCGTypes", "CFAttributedString"] }
objc2-application-services = { version = "0.3.2", default-features = false, features = ["std", "libc", "HIServices", "AXUIElement", "AXError", "AXValue", "AXValueConstants", "AXAttributeConstants", "AXActionConstants", "AXRoleConstants"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "libc", "NSRunningApplication", "NSWorkspace"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGImage", "CGDataProvider", "CGColorSpace", "CGDirectDisplay", "CGDisplayConfiguration", "CGGeometry", "CGWindow", "CGWindowLevel", "CGError"] }
objc2-vision = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-graphics", "objc2-core-foundation", "VNRequest", "VNRecognizeTextRequest", "VNRequestHandler", "VNObservation", "VNTypes", "VNDefines"] }

[dev-dependencies]
tempfile.workspace = true
