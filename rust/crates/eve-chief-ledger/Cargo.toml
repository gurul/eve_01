[package]
name = "eve-chief-ledger"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
eve-chief-card = { path = "../eve-chief-card" }
chrono.workspace = true
indexmap.workspace = true
libc.workspace = true
parking_lot.workspace = true
regex.workspace = true
# float_roundtrip: a card's times read back from cards.json are the floats Python wrote, to the bit, so a save
# keeps their digits (the default parser can be one ulp off).
serde_json = { workspace = true, features = ["float_roundtrip"] }
tempfile.workspace = true
thiserror.workspace = true
tracing.workspace = true
# str.isprintable (repr): the Unicode general category; the version eve-chief-card uses.
unicode-general-category = "1.1.0"
