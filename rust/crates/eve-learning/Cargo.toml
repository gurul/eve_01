[package]
name = "eve-learning"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "eve_learning"
path = "src/lib.rs"

# `python -m eve_bridge.learning` (learning/__main__.py).
[[bin]]
name = "eve-learning"
path = "src/main.rs"

[dependencies]
eve-envfile = { path = "../eve-envfile" }
eve-openrouter = { path = "../eve-openrouter" }
eve-spend = { path = "../eve-spend" }
eve-web = { path = "../eve-web" }
anyhow.workspace = true
thiserror.workspace = true
tokio.workspace = true
axum.workspace = true
serde_json.workspace = true
# LiveTutor's one blocking POST (Python's urllib.request.urlopen), run on the request's own thread.
reqwest = { workspace = true, features = ["blocking"] }
rusqlite.workspace = true
regex.workspace = true
sha2.workspace = true
hex.workspace = true
uuid.workspace = true
base64.workspace = true
rand.workspace = true
parking_lot.workspace = true
tracing.workspace = true
clap.workspace = true
# the bin's stderr log: Python's unconfigured logging prints warnings and errors there.
tracing-subscriber.workspace = true

[dev-dependencies]
# think_aloud.said_done's tests normalize with intent.normalize, as the voice does.
eve-intent = { path = "../eve-intent" }
tempfile.workspace = true
