[package]
name = "eve-lite-web"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# web.json: _read_json and write_private_json (0600, atomic).
eve-apps-mcp = { path = "../eve-apps-mcp" }
# onboarding: the two sign-ins, save_openrouter_key and credit.
eve-brain = { path = "../eve-brain" }
# Settings → Apps: APPS, link_ok, toolkit_slug and the ConnectBridge behind AppsDoor.
eve-composio-connect = { path = "../eve-composio-connect" }
# WEB_TOOLKITS: the web search toolkits eve never connects.
eve-composio-tools = { path = "../eve-composio-tools" }
# the env file save_openrouter_key writes (Environ).
eve-envfile = { path = "../eve-envfile" }
# peer_allowed, private_addresses, local_hostname, the Local Network alert and probe.
eve-lan-net = { path = "../eve-lan-net" }
# link_chat.LinkChat behind LinkServe (Headers, DynRead, DynWrite, CLOSE_SETTLE_SECS).
eve-link = { path = "../eve-link" }
# lite_rtc.RtcHub behind RtcDoor.
eve-lite-rtc = { path = "../eve-lite-rtc" }
# lite_tls.LocalTls behind TlsDoor: the LAN door's certificate.
eve-lite-tls = { path = "../eve-lite-tls" }
# openrouter.KEY_ENV.
eve-openrouter = { path = "../eve-openrouter" }
# profile.is_lite: the doors are eve lite's only.
eve-profile = { path = "../eve-profile" }
# Devices, PairingWindow, MacLogin and the cookies.
eve-web-auth = { path = "../eve-web-auth" }
anyhow.workspace = true
async-trait.workspace = true
futures.workspace = true
hex.workspace = true
indexmap.workspace = true
parking_lot.workspace = true
rand.workspace = true
base64.workspace = true
regex.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
# _Files: gzip.compress(data, compresslevel=6, mtime=0).
flate2 = "1.1.10"
# segno's place: the pairing links' QR codes (qr.rs draws them as segno does).
qrcode = { version = "0.14.1", default-features = false }
# the listening sockets: SO_REUSEADDR and IPV6_V6ONLY before bind.
socket2 = { version = "0.6.5", features = ["all"] }
# writer.start_tls with the Mac's certificate.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }

[dev-dependencies]
eve-link-uploads = { path = "../eve-link-uploads" }
eve-transcripts = { path = "../eve-transcripts" }
eve-link-reactions = { path = "../eve-link-reactions" }
plist = "1.10"
tempfile.workspace = true
tracing-subscriber.workspace = true
