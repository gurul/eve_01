eve-codex-auth = { path = "../eve-codex-auth" }
eve-codex-computer = { path = "../eve-codex-computer" }
eve-daemon = { path = "../eve-daemon" }
eve-dream = { path = "../eve-dream" }
eve-ears = { path = "../eve-ears" }
eve-envfile = { path = "../eve-envfile" }
eve-eve-mcp = { path = "../eve-eve-mcp" }
eve-explore = { path = "../eve-explore" }
eve-head-cal = { path = "../eve-head-cal" }
# hooks/_client.py's post
eve-hooks = { path = "../eve-hooks" }
eve-hud = { path = "../eve-hud" }
eve-identity = { path = "../eve-identity" }
eve-installer = { path = "../eve-installer" }
eve-intent = { path = "../eve-intent" }
eve-ipc = { path = "../eve-ipc" }
eve-key-tap = { path = "../eve-key-tap" }
eve-learning = { path = "../eve-learning" }
eve-lite = { path = "../eve-lite" }
eve-lite-web = { path = "../eve-lite-web" }
