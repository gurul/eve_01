eve-mem0-memory = { path = "../eve-mem0-memory" }
eve-memory = { path = "../eve-memory" }
eve-memory-bus = { path = "../eve-memory-bus" }
eve-meta = { path = "../eve-meta" }
eve-motion = { path = "../eve-motion" }
eve-notes = { path = "../eve-notes" }
eve-notes-widget = { path = "../eve-notes-widget" }
eve-openrouter = { path = "../eve-openrouter" }
eve-photos = { path = "../eve-photos" }
eve-places = { path = "../eve-places" }
eve-profile = { path = "../eve-profile" }
# recall.py and records.py
eve-records = { path = "../eve-records" }
eve-refresh = { path = "../eve-refresh" }
eve-scene = { path = "../eve-scene" }
# service.py and _service_launchd.py
eve-service = { path = "../eve-service" }
eve-steel-local = { path = "../eve-steel-local" }
eve-stick-link = { path = "../eve-stick-link" }
eve-toolchain = { path = "../eve-toolchain" }
