[package]
name = "eve-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "eve_bridge"
path = "src/lib.rs"

# `eve-bridge`: cli.py's main() (and `python -m eve_bridge`, __main__.py)
[[bin]]
name = "eve-bridge"
path = "src/main.rs"

[dependencies]
eve-app-registry = { path = "../eve-app-registry" }
eve-app-template = { path = "../eve-app-template" }
eve-apps-mcp = { path = "../eve-apps-mcp" }
eve-audit = { path = "../eve-audit" }
# notify.py, onboarding.py and telegram.py's diagnose
eve-brain = { path = "../eve-brain" }
eve-browser-lane = { path = "../eve-browser-lane" }
eve-chat-log = { path = "../eve-chat-log" }
# HomeEnv, for eve lite's launchd over a given HOME
