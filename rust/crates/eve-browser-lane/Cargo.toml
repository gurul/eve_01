[package]
name = "eve-browser-lane"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
eve-desktop-lanes = { path = "../eve-desktop-lanes" }
eve-jev = { path = "../eve-jev" }
eve-plan-contract = { path = "../eve-plan-contract" }
eve-steel-local = { path = "../eve-steel-local" }
eve-typed-ask = { path = "../eve-typed-ask" }
eve-vault = { path = "../eve-vault" }
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
regex.workspace = true
indexmap.workspace = true
parking_lot.workspace = true
tracing.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
futures.workspace = true
base64.workspace = true
url.workspace = true
dirs.workspace = true
# fetch_accounts runs on short-lived lookup threads, never in the async runtime (Python's urllib).
reqwest = { workspace = true, features = ["blocking"] }
# Python's `re` lookahead (_VOLATILE_NUMBER).
fancy-regex = "0.19.2"
# hashlib.sha1 of the snapshot (screen_changed); 0.10 shares `digest` with the workspace, as eve-vault does.
sha1 = "0.10"

[dev-dependencies]
tempfile.workspace = true
sha2.workspace = true
tracing-subscriber.workspace = true
# the live vault test reads the masked screenshot's pixels
image.workspace = true
