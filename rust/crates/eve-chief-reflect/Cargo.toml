[package]
name = "eve-chief-reflect"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Card, Phase, PhaseResult and verbs (task_router.CONSEQUENTIAL, the door floor's own words).
eve-chief-card = { path = "../eve-chief-card" }
# chief_dir: the default lessons folder (EVE_CHIEF_DIR).
eve-chief-ledger = { path = "../eve-chief-ledger" }
# openrouter.model: which models get medium reasoning.
eve-openrouter = { path = "../eve-openrouter" }
# spend.record_chat_completion(spend.CHIEF, ...).
eve-spend = { path = "../eve-spend" }
# watch.openrouter: the default `ask`.
eve-web = { path = "../eve-web" }
indexmap.workspace = true
libc.workspace = true
parking_lot.workspace = true
regex.workspace = true
serde.workspace = true
# float_roundtrip: a lesson's `t` read back from lessons.jsonl is the float Python wrote, to the bit.
# raw_value: an `n` or `trial` written `-0` is the int 0 to Python (serde_json reads it as the float -0.0).
serde_json = { workspace = true, features = ["float_roundtrip", "raw_value"] }
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
# str.casefold: Unicode full case folding, as CPython's (the version eve-chief-receipt uses).
caseless = "0.2.2"
# str.isprintable (Python repr of a non-string lesson): the version eve-chief-card uses.
unicode-general-category = "1.1.0"

[dev-dependencies]
tempfile.workspace = true
tokio.workspace = true
