[package]
name = "eve-explore"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
eve-openrouter = { path = "../eve-openrouter" }
eve-spend = { path = "../eve-spend" }
eve-vision = { path = "../eve-vision" }
anyhow.workspace = true
thiserror.workspace = true
tokio.workspace = true
serde_json.workspace = true
base64.workspace = true
tracing.workspace = true
chrono.workspace = true
parking_lot.workspace = true
libc.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFBase", "CFData", "CFDictionary", "CFCGTypes"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGImage", "CGDataProvider", "CGColorSpace", "CGContext", "CGBitmapContext"] }
objc2-image-io = { version = "0.3.2", default-features = false, features = ["std", "CGImageSource", "objc2-core-graphics"] }

[dev-dependencies]
tempfile.workspace = true
tracing-subscriber.workspace = true
axum.workspace = true
