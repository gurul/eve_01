[package]
name = "eve-web"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# `python -m eve_bridge.watch --render URL [TIMEOUT]`: the render child (watch::render::render_main).
[[bin]]
name = "eve-watch"
path = "src/bin/eve-watch.rs"

[dependencies]
eve-agent-contract = { path = "../eve-agent-contract" }
# WebReaderAgent keeps the run/steer/cancel/status contract (eve_app_reflex::Agent), so it drops in behind
# ReflexFirstAgent as a named body, as in Python; make_fallback is its MakeAgent.
eve-app-reflex = { path = "../eve-app-reflex" }
# watch::render presses cookie notices away with browser_lane's CONSENT_JS / consent_choice, and drives
# headless Chromium through its CDP driver (Playwright's place).
eve-browser-lane = { path = "../eve-browser-lane" }
# web_reader::configured reads browser_router::SHIPPED.
eve-browser-router = { path = "../eve-browser-router" }
# search_router's Predict (Jev's predict seam) and its PredictError.
eve-decider = { path = "../eve-decider" }
eve-jev = { path = "../eve-jev" }
eve-monid = { path = "../eve-monid" }
eve-openrouter = { path = "../eve-openrouter" }
eve-spend = { path = "../eve-spend" }
anyhow.workspace = true
thiserror.workspace = true
tokio.workspace = true
futures.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }
# http_request (watch.net), websearch's opener: blocking, run off the loop as Python's urllib is; a pinned
# resolver (dns_resolver) is the address the guard checked.
reqwest = { workspace = true, features = ["blocking"] }
chrono.workspace = true
chrono-tz = { workspace = true, features = ["case-insensitive"] }
regex.workspace = true
# Python `re` lookaheads (watch's _drop_blocks, _MAIN_OPEN).
fancy-regex = "0.19.2"
base64.workspace = true
sha2.workspace = true
hex.workspace = true
rand.workspace = true
url.workspace = true
urlencoding.workspace = true
dirs.workspace = true
tracing.workspace = true
indexmap.workspace = true
parking_lot.workspace = true
libc.workspace = true
html-escape.workspace = true
# Watcher::save: a temp file in the same folder, then a rename (Python's mkstemp + os.replace).
tempfile.workspace = true
# a body's charset= (Python's codec lookup); an unknown one falls back to UTF-8.
encoding_rs = "0.8.42"
# the guard proxy and http_request's deadline: shut a socket from another thread.
socket2 = { version = "0.6.5", features = ["all"] }

[dev-dependencies]
# test_watch_security's search-note replay composes the alert as the Telegram door does.
eve-telegram-format = { path = "../eve-telegram-format" }
tempfile.workspace = true
tokio.workspace = true
tracing-subscriber.workspace = true
