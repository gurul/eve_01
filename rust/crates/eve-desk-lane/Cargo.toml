[package]
name = "eve-desk-lane"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
eve-decisions = { path = "../eve-decisions" }
eve-desktop-lanes = { path = "../eve-desktop-lanes" }
anyhow.workspace = true
serde_json.workspace = true
parking_lot.workspace = true
tokio.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# pyautogui's macOS backend (Quartz CGEvent posting, the main display's size) and AXIsProcessTrusted.
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFCGTypes"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGEvent", "CGEventTypes", "CGRemoteOperation", "CGDirectDisplay"] }
objc2-application-services = { version = "0.3.2", default-features = false, features = ["std", "libc", "HIServices", "AXUIElement"] }

[dev-dependencies]
image.workspace = true
