[package]
name = "eve-ble"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
eve-protocol = { path = "../eve-protocol" }
anyhow.workspace = true
async-trait.workspace = true
btleplug = "0.13.5"
futures.workspace = true
parking_lot.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

# The WinRT radio power-cycle in `try_reset_radio`; the same versions btleplug
# itself builds against on Windows.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Devices_Bluetooth", "Devices_Radios", "Foundation"] }
# Its default `std` feature is what makes WinRT async operations `.await`-able.
windows-future = "0.3.2"
