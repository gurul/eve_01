[package]
name = "eve-refresh"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# notify.configured / read_token / post_once: the phone post (remind).
eve-brain = { path = "../eve-brain" }
# _service_launchd: agent_path, _write_plist, _load, the plist writer and the process boundary (schedule).
eve-service = { path = "../eve-service" }
anyhow.workspace = true
chrono.workspace = true
serde_json.workspace = true
# plistlib.loads: the signing profile `security cms -D` prints (XML or binary).
plist = "1.10"

[dev-dependencies]
tempfile.workspace = true
# HomeEnv: a Launchd under a temp HOME.
eve-claude-home = { path = "../eve-claude-home" }
