[package]
name = "eve-listen-key"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
eve-key-tap = { path = "../eve-key-tap" }
tokio.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFBase", "CFMachPort", "CFRunLoop"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGEvent", "CGEventTypes"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
