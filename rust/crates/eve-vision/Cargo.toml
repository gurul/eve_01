[package]
name = "eve-vision"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
tokio.workspace = true
futures.workspace = true
serde_json.workspace = true
base64.workspace = true
tracing.workspace = true
parking_lot.workspace = true
libc.workspace = true
flate2 = "1.1.10"
crc32fast = "1.5.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSEnumerator", "NSDictionary", "NSString", "NSError", "NSGeometry", "NSObject"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFBase", "CFData", "CFDictionary", "CFCGTypes"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGImage", "CGDataProvider", "CGColorSpace"] }
objc2-image-io = { version = "0.3.2", default-features = false, features = ["std", "CGImageSource", "objc2-core-graphics"] }
objc2-vision = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-graphics", "objc2-core-foundation", "VNRequest", "VNDetectFaceRectanglesRequest", "VNRequestHandler", "VNObservation", "VNFaceObservationAccepting", "VNTypes"] }

[dev-dependencies]
tempfile.workspace = true
