[package]
name = "eve-lite-rtc"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# link_chat.LinkChat behind the `link` channel (TURN_PATH, MESSAGES_PATH, Headers, DynRead, DynWrite).
eve-link = { path = "../eve-link" }
# phone_call.PhoneCalls behind the `call` channel (CallSocket, Closed, OP_TEXT, OP_BIN, SAMPLE_RATE, ...).
eve-phone-call = { path = "../eve-phone-call" }
anyhow.workspace = true
async-trait.workspace = true
bytes.workspace = true
futures.workspace = true
indexmap.workspace = true
libc.workspace = true
parking_lot.workspace = true
rand.workspace = true
base64.workspace = true
regex.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
# aiortc's place, as eve-pika and eve-obsbot-panel use it; `rtc` is its sans-IO core, named for the media types
# (MediaStreamTrack, codecs, transceiver directions, Sample) that webrtc does not re-export.
webrtc = "0.21.1"
rtc = { version = "0.21.1", default-features = false }

[dev-dependencies]
eve-link-uploads = { path = "../eve-link-uploads" }
eve-transcripts = { path = "../eve-transcripts" }
tempfile.workspace = true
uuid.workspace = true
tracing-subscriber.workspace = true
