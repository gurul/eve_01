[package]
name = "eve-link"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# link_chat: the controls listing, the stream paths and every control's 404 line come from the registry.
eve-app-registry = { path = "../eve-app-registry" }
# updates_composio: the read allow-list is checked again with is_read_only / consequential_slugs, and
# ComposioBridge is the production ComposioRead (seams.rs).
eve-composio-tools = { path = "../eve-composio-tools" }
# updates::local_zone is google_rest._local_zone.
eve-google-rest = { path = "../eve-google-rest" }
# AppsBridge is the production DirectApps (seams.rs): the calendar for link_today, Gmail and Calendar for updates.
eve-apps-mcp = { path = "../eve-apps-mcp" }
# the owner's attachments and eve's own pictures (UploadStore, ID_RE, served).
eve-link-uploads = { path = "../eve-link-uploads" }
# the reactions an app turn's owner message carries (Reactions.version, snapshot, listeners).
eve-link-reactions = { path = "../eve-link-reactions" }
# meet.events_in: the events of a calendar__list_events answer.
eve-meet = { path = "../eve-meet" }
# memory.enabled: the records folder and the hidden words are read only while memory is on.
eve-memory = { path = "../eve-memory" }
# memory_sources.sanitize: an eve row's sources.
eve-memory-sources = { path = "../eve-memory-sources" }
# muse_pi.available: the composer's eve/Muse switch.
eve-muse-pi = { path = "../eve-muse-pi" }
# link_topics.Titler and updates.Client call their models through OpenRouter.
eve-openrouter = { path = "../eve-openrouter" }
# phone_location (the latest fix) and places (the history).
eve-places = { path = "../eve-places" }
# recall.configured().records_dir and records.hidden_match.
eve-records = { path = "../eve-records" }
# rundown.OPEN_TASK and task_date: a note's open to-dos.
eve-rundown = { path = "../eve-rundown" }
# second_brain.configured: the vault when the chat has none.
eve-second-brain = { path = "../eve-second-brain" }
eve-spend = { path = "../eve-spend" }
# the conversation read back for the app (days, lines, FORGOTTEN, TALK).
eve-transcripts = { path = "../eve-transcripts" }
# watch.Watch, now_line and TELL_AFTER_ERRORS: the widget's watches.
eve-web = { path = "../eve-web" }
# WorkSessions is the production WorkDoor (seams.rs): the Work tab's Claude Code sessions.
eve-work-sessions = { path = "../eve-work-sessions" }
anyhow.workspace = true
thiserror.workspace = true
tokio.workspace = true
futures.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }
chrono.workspace = true
regex.workspace = true
# Python `re` lookarounds (updates' _HOST and _CODE, link_chat's ATTACHED_NOTE end anchor).
fancy-regex = "0.19.2"
sha2.workspace = true
hex.workspace = true
# secrets.token_hex: a turn id when the client_id is not a plain one.
rand.workspace = true
# updates_composio.safe_link: urllib.parse.urlsplit.
url.workspace = true
# X-Filename is percent-encoded (urllib.parse.unquote); the query string (parse_qsl).
urlencoding.workspace = true
dirs.workspace = true
tracing.workspace = true
indexmap.workspace = true
parking_lot.workspace = true
# Bookmarks, Titler and UpdatesStore write through a temp file in the same folder, then a rename.
tempfile.workspace = true
# updates.note_items walks the vault (os.walk, sorted, no symlinks).
walkdir.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio.workspace = true
tracing-subscriber.workspace = true
