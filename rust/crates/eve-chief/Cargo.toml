[package]
name = "eve-chief"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# chief_card: the record (Card, Phase, parse, backbrief, at_time).
eve-chief-card = { path = "../eve-chief-card" }
# chief_desk: the attention gate, quiet hours, the brief, the evening close and the weekly sheet.
eve-chief-desk = { path = "../eve-chief-desk" }
# chief_ledger: the cards and their events.
eve-chief-ledger = { path = "../eve-chief-ledger" }
# chief_receipt: the oracles and the receipt.
eve-chief-receipt = { path = "../eve-chief-receipt" }
# chief_reflect: Reflexion's lessons.
eve-chief-reflect = { path = "../eve-chief-reflect" }
# chief_replan: the replanner's triggers, request, parse and rules.
eve-chief-replan = { path = "../eve-chief-replan" }
# consent.bare_decision: only a reply that is wholly a yes answers a Go.
eve-consent = { path = "../eve-consent" }
# menu_tools.enabled: jobs_list's wide description.
eve-menu-tools = { path = "../eve-menu-tools" }
# pricing.estimate_openai_cost.
eve-pricing = { path = "../eve-pricing" }
# spend: the job tag, record_response, job_total.
eve-spend = { path = "../eve-spend" }
# make_chief's real research: web_reader.configured / _take_task and search_router.answer.
eve-web = { path = "../eve-web" }
# make_chief's research router: browser_router.jev_router.
eve-browser-router = { path = "../eve-browser-router" }
# eve_jev::Env (browser_router.jev_router's environ; ProcessEnv for os.environ).
eve-jev = { path = "../eve-jev" }
