[workspace]
resolver = "2"
members = ["crates/*"]

# eve's Claude Code hooks in Rust: eve-hooks (the hook binaries) and eve-ipc (the daemon socket they talk to).
# The daemon itself is Python (bridge/). The full Rust port of the daemon is kept under the tag rust-port-full.
[workspace.package]
version = "0.1.3"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0 AND MIT"
publish = false

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tracing = "0.1"
parking_lot = "0.12"
libc = "0.2"
tempfile = "3"

[profile.release]
strip = true
