[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.3"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0 AND MIT"
publish = false

# Shared external dependencies. A crate opts in with `tokio.workspace = true`.
# A crate that needs something not listed here declares it in its own
# Cargo.toml with an explicit version; do not edit this file from a port.
[workspace.dependencies]
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "multipart", "rustls-tls", "gzip", "brotli"] }
axum = { version = "0.8", features = ["ws", "multipart"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
regex = "1"
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
rand = "0.9"
url = "2"
urlencoding = "2"
dirs = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.32", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
indexmap = { version = "2", features = ["serde"] }
parking_lot = "0.12"
libc = "0.2"
bytes = "1"
mime_guess = "2"
walkdir = "2"
glob = "0.3"
tempfile = "3"
notify = "8"
serialport = "4"
image = "0.25"
scraper = "0.22"
html-escape = "0.2"
shell-words = "1"
which = "7"
